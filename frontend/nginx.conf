server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Демо не скрывает отсутствие API за HTML страницы.
    # При интеграции заменить на proxy_pass http://backend:8000;
    location /api/ {
        default_type application/json;
        return 503 '{"error":{"code":"BACKEND_NOT_CONNECTED","message":"Backend не подключён к frontend-демо."}}';
    }
}
